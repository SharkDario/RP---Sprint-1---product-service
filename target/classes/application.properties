spring.application.name=product-service
# activate the console
spring.h2.console.enabled = true
# give an url to the console
spring.h2.console.path = /h2-console
# indicate to Spring Boot which is the DB's url
spring.datasource.url = jdbc:h2:mem:productdb
# port for the user-service
server.port=8082

eureka.client.service-url.defaultZone = http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# localhost
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# expiration we can provide any value
jwt.expiration = ${EXPIRATION_TIME}
# environment variable: Base64 format and minimum length 32 bytes
jwt.secret = ${SECRET_KEY}